name: Build algorithm images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/benchmark.json
      - .github/workflows/build-images.yml

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      algorithms: ${{ steps.read.outputs.algorithms }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          MATRIX=$(jq -c '[.algorithms | to_entries[] | {name: .key, source: .value.source, commit: .value.commit, tag: .value.commit[0:8]}]' config/benchmark.json)
          echo "algorithms=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.algorithms) }}
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim runner disk for ML images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force --volumes
          df -h /
      - name: Fetch immutable algorithm source
        run: |
          git init algorithm
          git -C algorithm remote add origin '${{ matrix.source }}'
          git -C algorithm fetch --depth=1 origin '${{ matrix.commit }}'
          git -C algorithm checkout --detach FETCH_HEAD
          test "$(git -C algorithm rev-parse HEAD)" = '${{ matrix.commit }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: algorithm
          push: true
          platforms: linux/amd64
          tags: ghcr.io/hamsterstation/rcabench-${{ matrix.name }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
          provenance: true
          sbom: true
