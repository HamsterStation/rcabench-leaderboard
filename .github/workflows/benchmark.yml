name: Full benchmark

on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Comma-separated registered benchmarks or all"
        required: true
        default: all
      algorithms:
        description: "Comma-separated registered algorithms or all"
        required: true
        default: all
  repository_dispatch:
    types: [dataset-updated, algorithm-updated]

permissions:
  contents: write
  packages: read

concurrency:
  group: full-benchmark
  cancel-in-progress: false

env:
  RCABENCH_STORAGE: ${{ vars.RCABENCH_STORAGE || '/mnt/jfs-fixed/rcabench-ci' }}

jobs:
  plan:
    if: vars.BENCHMARK_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          REQUESTED_BENCHMARKS: ${{ inputs.benchmarks || github.event.client_payload.benchmarks || 'all' }}
          REQUESTED_ALGORITHMS: ${{ inputs.algorithms || github.event.client_payload.algorithms || 'all' }}
        run: |
          MATRIX=$(PYTHONPATH=src python -m rcabench_leaderboard.matrix benchmarks \
            --benchmarks "$REQUESTED_BENCHMARKS" --algorithms "$REQUESTED_ALGORITHMS")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, linux, x64, rcabench]
    steps:
      - uses: actions/checkout@v4
      - name: Set up runner Python
        shell: bash
        run: |
          BASE_PYTHON='${{ vars.RCABENCH_PYTHON || '/mnt/jfs-fixed/rcabench-venv/bin/python' }}'
          if [[ ! -x "$BASE_PYTHON" ]]; then
            echo "Python is unavailable at $BASE_PYTHON" >&2
            exit 1
          fi
          "$BASE_PYTHON" -m venv "$RUNNER_TEMP/rcabench-venv"
          echo "$RUNNER_TEMP/rcabench-venv/bin" >> "$GITHUB_PATH"
      - name: Install benchmark controller
        run: python -m pip install -e .
      - name: Resolve versioned cache paths
        env:
          BENCHMARK_CONFIG: ${{ matrix.config }}
        run: |
          REVISION=$(python -c 'import os; from rcabench_leaderboard.config import load_config; print(load_config(os.environ["BENCHMARK_CONFIG"])["dataset"]["revision"])')
          SAFE_REVISION=$(printf '%s' "$REVISION" | tr -c 'A-Za-z0-9_.-' '-')
          echo "BENCHMARK_CONFIG=${{ matrix.config }}" >> "$GITHUB_ENV"
          echo "DATASET_DIR=$RCABENCH_STORAGE/datasets/${{ matrix.benchmark }}-$SAFE_REVISION" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download pinned dataset snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "$DATASET_DIR"
          for attempt in {1..12}; do
            if rcabench-leaderboard download --config "$BENCHMARK_CONFIG" --output "$DATASET_DIR"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Dataset download failed after $attempt resumable attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Dataset download attempt $attempt failed; resuming in ${delay}s" >&2
            sleep "$delay"
          done
      - name: Prepare dataset adapter
        run: >-
          rcabench-leaderboard normalize --adapter '${{ matrix.adapter }}'
          --config "$BENCHMARK_CONFIG" --snapshot "$DATASET_DIR"
      - name: Pull algorithm image
        run: |
          IMAGE=$(python -c 'import os; from rcabench_leaderboard.config import load_config; print(load_config(os.environ["BENCHMARK_CONFIG"])["algorithms"]["${{ matrix.algorithm }}"]["image"])')
          docker pull "$IMAGE"
      - name: Prepare trained assets
        if: matrix.prepare
        id: prepare
        run: |
          ASSETS=$(rcabench-leaderboard prepare '${{ matrix.algorithm }}' \
            --config "$BENCHMARK_CONFIG" --snapshot "$DATASET_DIR" \
            --cache-root "$RCABENCH_STORAGE/cache")
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"
      - name: Evaluate algorithm
        run: |
          ASSET_ARGS=()
          if [[ -n '${{ steps.prepare.outputs.assets }}' ]]; then
            ASSET_ARGS=(--assets '${{ steps.prepare.outputs.assets }}')
          fi
          RUN_ROOT="$RCABENCH_STORAGE/runs/${{ github.run_id }}/${{ matrix.benchmark }}/${{ matrix.algorithm }}"
          mkdir -p "$RUN_ROOT"
          rcabench-leaderboard run '${{ matrix.algorithm }}' \
            --config "$BENCHMARK_CONFIG" --snapshot "$DATASET_DIR" \
            --output "$RUN_ROOT/cases" "${ASSET_ARGS[@]}"
          rcabench-leaderboard evaluate '${{ matrix.algorithm }}' \
            --config "$BENCHMARK_CONFIG" --snapshot "$DATASET_DIR" \
            --results "$RUN_ROOT/cases" --output "$RUN_ROOT/metrics.json" \
            --require-complete
          cp "$RUN_ROOT/metrics.json" metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.benchmark }}-${{ matrix.algorithm }}
          path: metrics.json
          if-no-files-found: error

  collect:
    needs: [plan, evaluate]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          path: collected
      - name: Promote results
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          RUN_ID='github-${{ github.run_id }}-${{ github.run_attempt }}'
          while IFS= read -r row; do
            benchmark=$(jq -r .benchmark <<< "$row")
            algorithm=$(jq -r .algorithm <<< "$row")
            config=$(jq -r .config <<< "$row")
            metrics="collected/metrics-$benchmark-$algorithm/metrics.json"
            [[ -f "$metrics" ]] || continue
            rcabench-leaderboard record "$algorithm" --config "$config" \
              --metrics "$metrics" --run-id "$RUN_ID" \
              --archive "results/history/$RUN_ID/$benchmark/$algorithm.json"
          done < <(jq -c '.[]' <<< "$MATRIX")
          rcabench-leaderboard build-site
      - name: Commit leaderboard update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/leaderboard.json results/history
          git commit -m 'results: publish benchmark ${{ github.run_id }}' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
