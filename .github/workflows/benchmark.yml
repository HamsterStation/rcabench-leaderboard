name: Full benchmark

on:
  workflow_dispatch:
    inputs:
      algorithms:
        description: "Comma-separated algorithms or all"
        required: true
        default: all
  repository_dispatch:
    types: [dataset-updated, algorithm-updated]
  workflow_run:
    workflows: [Build algorithm images]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: read

concurrency:
  group: full-benchmark
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        algorithm: [baro, art, eadro, causalrca]
    runs-on: [self-hosted, linux, x64, rcabench]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select algorithm
        id: select
        shell: bash
        run: |
          requested='${{ inputs.algorithms || 'all' }}'
          if [[ "$requested" != "all" && ",$requested," != *",${{ matrix.algorithm }},"* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install benchmark controller
        if: steps.select.outputs.enabled == 'true'
        run: python -m pip install -e .
      - name: Log in to GHCR
        if: steps.select.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download pinned dataset snapshot
        if: steps.select.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "$HOME/.cache/rcabench/datasets/v1.0.0"
          rcabench-leaderboard download --output "$HOME/.cache/rcabench/datasets/v1.0.0"
      - name: Pull algorithm image
        if: steps.select.outputs.enabled == 'true'
        run: |
          IMAGE=$(python -c 'import json; print(json.load(open("config/benchmark.json"))["algorithms"]["${{ matrix.algorithm }}"]["image"])')
          docker pull "$IMAGE"
      - name: Prepare trained assets
        if: steps.select.outputs.enabled == 'true' && (matrix.algorithm == 'art' || matrix.algorithm == 'eadro')
        id: prepare
        run: |
          ASSETS=$(rcabench-leaderboard prepare '${{ matrix.algorithm }}' \
            --snapshot "$HOME/.cache/rcabench/datasets/v1.0.0" \
            --cache-root "$HOME/.cache/rcabench")
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"
      - name: Evaluate algorithm
        if: steps.select.outputs.enabled == 'true'
        run: |
          ASSET_ARGS=()
          if [[ -n '${{ steps.prepare.outputs.assets }}' ]]; then
            ASSET_ARGS=(--assets '${{ steps.prepare.outputs.assets }}')
          fi
          RUN_ROOT="$HOME/rcabench-runs/${{ github.run_id }}/${{ matrix.algorithm }}"
          mkdir -p "$RUN_ROOT"
          rcabench-leaderboard run '${{ matrix.algorithm }}' \
            --snapshot "$HOME/.cache/rcabench/datasets/v1.0.0" \
            --output "$RUN_ROOT/cases" "${ASSET_ARGS[@]}"
          rcabench-leaderboard evaluate '${{ matrix.algorithm }}' \
            --snapshot "$HOME/.cache/rcabench/datasets/v1.0.0" \
            --results "$RUN_ROOT/cases" --output "$RUN_ROOT/metrics.json" \
            --require-complete
          cp "$RUN_ROOT/metrics.json" metrics.json
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.enabled == 'true'
        with:
          name: metrics-${{ matrix.algorithm }}
          path: metrics.json
          if-no-files-found: error

  collect:
    needs: evaluate
    if: needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          path: collected
      - name: Promote results
        run: |
          RUN_ID='github-${{ github.run_id }}-${{ github.run_attempt }}'
          for algorithm in baro art eadro causalrca; do
            metrics="collected/metrics-$algorithm/metrics.json"
            [[ -f "$metrics" ]] || continue
            rcabench-leaderboard record "$algorithm" --metrics "$metrics" --run-id "$RUN_ID" \
              --archive "results/history/$RUN_ID/$algorithm.json"
          done
          rcabench-leaderboard build-site
      - name: Commit leaderboard update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/leaderboard.json results/history
          git commit -m 'results: publish benchmark ${{ github.run_id }}' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

