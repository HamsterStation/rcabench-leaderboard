name: Full benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke-diagfusion:
    runs-on: [self-hosted, linux, x64, rcabench]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run cross-system DiagFusion smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE=ghcr.io/hamsterstation/rcabench-diagfusion:38e16491-r1
          REPO="$GITHUB_WORKSPACE"
          FSE=/mnt/jfs-fixed/rcabench-ci/datasets/fse-v1.0.0/ts4-ts-ui-dashboard-request-delay-9gnvk2
          OPS=/mnt/jfs-fixed/rcabench-ci/datasets/ops-lite-9ac09981c08ab02a0b923eab7830d778934851a8
          SMOKE=/home/nn/rcabench-smoke/diagfusion-38e16491-r1
          mkdir -p "$SMOKE"
          docker pull "$IMAGE"

          run_case() {
            local label=$1 case_dir=$2
            local output="$SMOKE/$label"
            mkdir -p "$output"
            timeout 950 docker run --rm --network none --cpus 4 \
              --entrypoint .venv/bin/python --workdir /app \
              --env PYTHONPATH=/app --env OMP_NUM_THREADS=4 \
              --env MKL_NUM_THREADS=4 --env OPENBLAS_NUM_THREADS=4 \
              --env CHECKPOINT_PATH=/app/data/middle/checkpoints/service_model.pt \
              --env DYNACONF_PATHS__METADATA=/app/data/middle/metadata \
              --env DYNACONF_PATHS__CKPT=/app/data/middle/checkpoints \
              --volume "$case_dir/converted:/input:ro" \
              --volume "$output:/output" \
              --volume "$REPO/containers/run_algorithm.py:/benchmark_runner.py:ro" \
              "$IMAGE" /benchmark_runner.py diagfusion \
              --input /input --output /output --datapack "$label" \
              >"$output/run.log" 2>&1
          }

          # DiagFusion is memory-heavy, so keep the three smoke cases serial.
          run_case fse "$FSE"
          run_case ops-hotel "$OPS/batch-01KQHDBB5Y8K69Z13G7VSWG9FS"
          run_case ops-train "$OPS/batch-01KQJ23RSSQ3W1ESP1DJDHDFE2"

          for label in fse ops-hotel ops-train; do
            jq -e '
              .status == "ok" and
              (.error == null) and
              (.answers | length > 0) and
              ([.answers[].level] | all(. == "service"))
            ' "$SMOKE/$label/result.json"
          done

          docker run --rm --entrypoint .venv/bin/python "$IMAGE" -c '
          import ast
          from pathlib import Path

          targets = {
              "/app/src/diagfusion/DiagfusionClass.py": {"diagfusion"},
              "/app/src/preprocess/process_data.py": {"process_data_inference"},
          }
          for filename, names in targets.items():
              source = Path(filename).read_text()
              tree = ast.parse(source)
              for node in tree.body:
                  if isinstance(node, (ast.ClassDef, ast.FunctionDef)) and node.name in names:
                      print(ast.get_source_segment(source, node))
          ' >"$SMOKE/active-inference-source.txt"
          if grep -Ein 'injection\.json|ground[_-]?truth|preprocess_injection' \
            "$SMOKE/active-inference-source.txt" \
            >"$SMOKE/ground-truth-audit.txt"; then
            exit 1
          fi
          test ! -s "$SMOKE/ground-truth-audit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: diagfusion-cross-system-smoke
          path: /home/nn/rcabench-smoke/diagfusion-38e16491-r1
          if-no-files-found: error
