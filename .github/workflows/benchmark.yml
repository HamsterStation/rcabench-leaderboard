name: Full benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke-art:
    runs-on: [self-hosted, linux, x64, rcabench]
    steps:
      - uses: actions/checkout@v4
      - name: Set up runner Python
        shell: bash
        run: |
          BASE_PYTHON='${{ vars.RCABENCH_PYTHON || '/mnt/jfs-fixed/rcabench-venv/bin/python' }}'
          [[ -x "$BASE_PYTHON" ]] || { echo "Missing Python: $BASE_PYTHON" >&2; exit 1; }
          "$BASE_PYTHON" -m venv "$RUNNER_TEMP/rcabench-venv"
          echo "$RUNNER_TEMP/rcabench-venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare assets and run cross-system ART smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE=ghcr.io/hamsterstation/rcabench-art:e67094a3-r1
          REPO="$GITHUB_WORKSPACE"
          FSE=/mnt/jfs-fixed/rcabench-ci/datasets/fse-v1.0.0
          OPS=/mnt/jfs-fixed/rcabench-ci/datasets/ops-lite-9ac09981c08ab02a0b923eab7830d778934851a8
          CACHE=/var/tmp/rcabench-ci/cache
          SMOKE=/home/nn/rcabench-smoke/art-e67094a3-r1
          mkdir -p "$SMOKE"
          docker pull "$IMAGE"

          FSE_ASSETS=$(rcabench-leaderboard prepare art \
            --config config/benchmark.json --snapshot "$FSE" --cache-root "$CACHE")
          OPS_ASSETS=$(rcabench-leaderboard prepare art \
            --config config/ops-lite.json --snapshot "$OPS" --cache-root "$CACHE")
          printf '%s\n' "$FSE_ASSETS" >"$SMOKE/fse-assets-path.txt"
          printf '%s\n' "$OPS_ASSETS" >"$SMOKE/ops-assets-path.txt"

          run_case() {
            local label=$1 case_dir=$2 assets=$3
            local output="$SMOKE/$label"
            mkdir -p "$output"
            timeout 600 docker run --rm --network none --cpus 4 \
              --entrypoint /.venv/bin/python --workdir / \
              --env PYTHONPATH=/ --env OMP_NUM_THREADS=4 \
              --env MKL_NUM_THREADS=4 --env OPENBLAS_NUM_THREADS=4 \
              --volume "$case_dir/converted:/input:ro" \
              --volume /dev/null:/input/injection.json:ro \
              --volume "$output:/output" \
              --volume "$assets/model.pkl:/model.pkl:ro" \
              --volume "$assets/node_dict.pkl:/data/RCABENCH/node_dict.pkl:ro" \
              --volume "$assets/metric_dict.pkl:/data/RCABENCH/metric_dict.pkl:ro" \
              --volume "$REPO/containers/run_algorithm.py:/benchmark_runner.py:ro" \
              "$IMAGE" /benchmark_runner.py art \
              --input /input --output /output --datapack "$label" \
              >"$output/run.log" 2>&1
          }

          run_case fse "$FSE/ts4-ts-ui-dashboard-request-delay-9gnvk2" "$FSE_ASSETS"
          run_case ops-hotel "$OPS/batch-01KQHDBB5Y8K69Z13G7VSWG9FS" "$OPS_ASSETS"
          run_case ops-train "$OPS/batch-01KQJ23RSSQ3W1ESP1DJDHDFE2" "$OPS_ASSETS"

          for label in fse ops-hotel ops-train; do
            jq -e '
              .status == "ok" and
              (.error == null) and
              (.answers | length > 0) and
              ([.answers[].level] | all(. == "service"))
            ' "$SMOKE/$label/result.json"
          done

          docker run --rm -i --entrypoint /.venv/bin/python "$IMAGE" - \
            >"$SMOKE/ground-truth-audit.txt" <<'PY'
          import ast
          from pathlib import Path

          targets = {
              Path('/main.py'): {'__call__'},
              Path('/client.py'): {'inference_single', 'preprocess_single'},
              Path('/src/preprocess.py'): {'build_inference_context'},
          }
          forbidden = ('build_groundtruth', 'injection.json', 'ground_truth', 'ground-truth')
          for path, names in targets.items():
              source = path.read_text()
              tree = ast.parse(source)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names:
                      segment = ast.get_source_segment(source, node) or ''
                      assert not any(token in segment for token in forbidden), (path, node.name)
          PY
          test ! -s "$SMOKE/ground-truth-audit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: art-cross-system-smoke
          path: /home/nn/rcabench-smoke/art-e67094a3-r1
          if-no-files-found: error
