name: Full benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke-shapleyiq:
    runs-on: [self-hosted, linux, x64, rcabench]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run cross-system ShapleyIQ smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE=ghcr.io/hamsterstation/rcabench-shapleyiq:ceac113d-r1
          REPO="$GITHUB_WORKSPACE"
          FSE=/mnt/jfs-fixed/rcabench-ci/datasets/fse-v1.0.0/ts4-ts-ui-dashboard-request-delay-9gnvk2
          OPS=/mnt/jfs-fixed/rcabench-ci/datasets/ops-lite-9ac09981c08ab02a0b923eab7830d778934851a8
          SMOKE=/home/nn/rcabench-smoke/shapleyiq-ceac113d-r1
          mkdir -p "$SMOKE"
          docker pull "$IMAGE"

          run_case() {
            local label=$1 case_dir=$2
            local output="$SMOKE/$label"
            mkdir -p "$output"
            timeout 950 docker run --rm --network none --cpus 2 \
              --entrypoint .venv/bin/python --workdir /app \
              --env PYTHONPATH=/app --env OMP_NUM_THREADS=2 \
              --env MKL_NUM_THREADS=2 --env OPENBLAS_NUM_THREADS=2 \
              --volume "$case_dir/converted:/input:ro" \
              --volume "$output:/output" \
              --volume "$REPO/containers/run_algorithm.py:/benchmark_runner.py:ro" \
              "$IMAGE" /benchmark_runner.py shapleyiq \
              --input /input --output /output --datapack "$label" \
              >"$output/run.log" 2>&1
          }

          run_case fse "$FSE" &
          p1=$!
          run_case ops-hotel "$OPS/batch-01KQHDBB5Y8K69Z13G7VSWG9FS" &
          p2=$!
          run_case ops-train "$OPS/batch-01KQJ23RSSQ3W1ESP1DJDHDFE2" &
          p3=$!
          wait "$p1" "$p2" "$p3"

          for label in fse ops-hotel ops-train; do
            jq -e '
              .status == "ok" and
              (.error == null) and
              (.answers | length > 0) and
              ([.answers[].level] | all(. == "service"))
            ' "$SMOKE/$label/result.json"
          done

          docker run --rm --entrypoint sh "$IMAGE" -lc \
            "grep -RInE 'injection\\.json|ground[_-]?truth' \
              /app/src/shapleyiq/platform /app/main.py || true" \
            >"$SMOKE/ground-truth-audit.txt"
          test ! -s "$SMOKE/ground-truth-audit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: shapleyiq-cross-system-smoke
          path: /home/nn/rcabench-smoke/shapleyiq-ceac113d-r1
          if-no-files-found: error
