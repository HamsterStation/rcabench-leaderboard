name: Full benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke-causalrca:
    runs-on: [self-hosted, linux, x64, rcabench]
    steps:
      - uses: actions/checkout@v4
      - name: Set up runner Python
        shell: bash
        run: |
          BASE_PYTHON='${{ vars.RCABENCH_PYTHON || '/mnt/jfs-fixed/rcabench-venv/bin/python' }}'
          [[ -x "$BASE_PYTHON" ]] || { echo "Missing Python: $BASE_PYTHON" >&2; exit 1; }
          "$BASE_PYTHON" -m venv "$RUNNER_TEMP/rcabench-venv"
          echo "$RUNNER_TEMP/rcabench-venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ground-truth-free cross-system smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE=ghcr.io/hamsterstation/rcabench-causalrca:3f4ceee8-r1
          REPO="$GITHUB_WORKSPACE"
          FSE=/mnt/jfs-fixed/rcabench-ci/datasets/fse-v1.0.0
          OPS=/mnt/jfs-fixed/rcabench-ci/datasets/ops-lite-9ac09981c08ab02a0b923eab7830d778934851a8
          SMOKE=/home/nn/rcabench-smoke/causalrca-3f4ceee8-r1
          mkdir -p "$SMOKE"
          docker pull "$IMAGE"

          run_case() {
            local label=$1 case_dir=$2
            local output="$SMOKE/$label"
            mkdir -p "$output"
            timeout 1800 docker run --rm --network none --cpus 4 \
              --entrypoint .venv/bin/python --workdir /app \
              --env PYTHONPATH=/app --env OMP_NUM_THREADS=4 \
              --env MKL_NUM_THREADS=4 --env OPENBLAS_NUM_THREADS=4 \
              --volume "$case_dir/converted:/input:ro" \
              --volume /dev/null:/input/injection.json:ro \
              --volume "$output:/output" \
              --volume "$REPO/containers/run_algorithm.py:/benchmark_runner.py:ro" \
              "$IMAGE" /benchmark_runner.py causalrca \
              --input /input --output /output --datapack "$label" \
              >"$output/run.log" 2>&1
          }

          run_case fse "$FSE/ts4-ts-ui-dashboard-request-delay-9gnvk2"
          run_case ops-hotel "$OPS/batch-01KQHDBB5Y8K69Z13G7VSWG9FS"
          run_case ops-train "$OPS/batch-01KQJ23RSSQ3W1ESP1DJDHDFE2"

          for label in fse ops-hotel ops-train; do
            jq -e '
              .status == "ok" and
              (.error == null) and
              (.answers | length > 0) and
              ([.answers[].level] | all(. == "service"))
            ' "$SMOKE/$label/result.json"
          done

          docker run --rm -i --entrypoint .venv/bin/python "$IMAGE" - \
            >"$SMOKE/ground-truth-audit.txt" <<'PY'
          import inspect

          from rcabench_platform.v2.graphs.sdg.build_.rcabench import (
              load_inject_time as platform_load_inject_time,
          )
          from rcaeval_causalrca._common import SimpleMetricsAdapter, load_inject_time
          from rcaeval_causalrca.causalrca import CausalRCA, causalrca

          targets = (
              CausalRCA.__call__,
              SimpleMetricsAdapter.__call__,
              causalrca,
              load_inject_time,
              platform_load_inject_time,
          )
          forbidden = ("injection.json", "ground_truth", "ground-truth")
          for target in targets:
              source = inspect.getsource(target)
              assert not any(token in source for token in forbidden), target
          PY
          test ! -s "$SMOKE/ground-truth-audit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: causalrca-cross-system-smoke
          path: /home/nn/rcabench-smoke/causalrca-3f4ceee8-r1
          if-no-files-found: error
