name: Validate dataset submission

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - config/datasets.json
      - config/*.json
      - config/splits/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: validator
          persist-credentials: false
      - name: Check out candidate data files
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validator/pyproject.toml
      - name: Install trusted validator only
        run: python -m pip install -e validator
      - name: Validate public fork submission
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: >-
          PYTHONPATH=validator/src python validator/scripts/validate_dataset_submission.py
          --root candidate --base-root validator
      - name: Validate trusted private or public submission
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          PYTHONPATH=validator/src python validator/scripts/validate_dataset_submission.py
          --root candidate --base-root validator
