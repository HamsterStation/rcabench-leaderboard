name: Watch algorithm upstreams

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_upstreams.py --apply
      - run: pytest -q
      - id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-algorithm-pins
          delete-branch: true
          commit-message: "chore: update algorithm revisions"
          title: "chore: evaluate updated algorithm revisions"
          body: |
            Automated upstream revision update.

            Merging this PR builds new immutable containers and queues a full
            benchmark on the self-hosted runner.
          labels: algorithm-update,benchmark
      - name: Evaluate the algorithm PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run benchmark-pr.yml --ref main -f pr_number='${{ steps.pr.outputs.pull-request-number }}'
